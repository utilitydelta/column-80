# Ship on tag: push v1.0.0 -> one .vsix, a GitHub Release carrying it, and a
# Marketplace publish when VSCE_PAT is set.
#
# ONE package, not human-replay's per-platform matrix. Nothing here is native:
# the bundle is pure JS and the one runtime dependency, pyright, ships its own
# platform-independent dist. A `--target`ed build would only pin the vsix to an
# OS it does not care about.

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history, for the same reason ci.yml needs it: the differential rows
      # `git show` named pre-change commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 24 for the same reason ci.yml pins it: `node --test` glob expansion.
      - uses: actions/setup-node@v4
        with:
          # PINNED, not the floating major (2026-08-10). `24` resolves to the newest
          # 24.x, and 24.18 counts a failing `todo` row toward the exit code where
          # 24.12 does not. The suite carries todo rows that are red ON PURPOSE,
          # each with a written ruling, so a floating runtime turned a green suite
          # red without a line of source changing. Raise this deliberately, with the
          # todo rows re-decided, never by drifting.

          node-version: 24.12.0
          cache: npm

      - name: Tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG" != "$TAG" ]; then
            echo "tag $TAG does not match package.json $PKG" >&2
            exit 1
          fi

      # No test:unit here, deliberately. A tag points at a commit ci.yml has
      # already run the suite against, so re-running it at publish time proves
      # nothing new - and it can fail, because a handful of rows measure wall
      # clock (a sub-2ms perf budget, a real 1500ms timer, a log line that grows
      # a gateWait= field under load) and a shared two-core runner is not the
      # hardware they were written on. Measured: of the first two runs with a
      # working environment, one was green and one had three such failures, a
      # different three. A red here fails the job with the tag already public and
      # immutable, which is a strictly worse place to find out than a red ci run
      # on main. Push, watch ci go green, then tag. Item 23 is the real fix.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Package
        run: npx @vscode/vsce package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          body: "See CHANGELOG.md for this release's changes."

      # Marketplace publish is opt-in: add a VSCE_PAT repo secret (a Personal
      # Access Token for the 'utilitydelta' publisher) and this step publishes;
      # without it the step skips and the GitHub Release is the ship.
      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not set - skipping Marketplace publish (GitHub Release only)"
            exit 0
          fi
          # The gallery times out under load, which stranded a human-replay
          # release mid-publish. That is transient, so retry with backoff. A
          # duplicate version is what a re-run of a partial failure sees: treat
          # it as done, not an error.
          f=$(ls *.vsix | head -1)
          for attempt in 1 2 3; do
            if out=$(npx @vscode/vsce publish --packagePath "$f" -p "$VSCE_PAT" 2>&1); then
              echo "$out"; exit 0
            fi
            echo "$out"
            if echo "$out" | grep -qiE "already exists|already published|409"; then
              echo "$f: this version is already on the Marketplace - skipping"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "publish attempt $attempt failed - retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done
          echo "publish failed after 3 attempts" >&2
          exit 1

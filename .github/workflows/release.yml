# Ship on tag: push v1.0.0 -> one .vsix PER TARGET, a GitHub Release carrying all four, and a
# Marketplace publish of all four when VSCE_PAT is set.
#
# Per-target since session-v65: dictation spawns two native binaries (native/README.md), so the
# package carries the pair built for its platform and nothing else. Four targets, four runners,
# then one package job that stages each target's pair into native/bin/<target>/ and runs
# `vsce package --target` once per target. Everything else in the bundle is still pure JS.
#
# macOS and Windows binaries are built here and have NOT been proven on real hardware yet
# (session-v65 ruling 2: built for all three, proven on Linux). Prove them before trusting a
# release on those platforms.

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: darwin-arm64
            os: macos-14
          - target: darwin-x64
            # macos-13 was retired 2025-12-08; this is GitHub's Intel replacement.
            os: macos-15-intel
          - target: win32-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run native:build
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native/bin/${{ matrix.target }}/
          if-no-files-found: error

  release:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history, for the same reason ci.yml needs it: the differential rows
      # `git show` named pre-change commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 24 for the same reason ci.yml pins it: `node --test` glob expansion.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG" != "$TAG" ]; then
            echo "tag $TAG does not match package.json $PKG" >&2
            exit 1
          fi

      # No test:unit here, deliberately. A tag points at a commit ci.yml has
      # already run the suite against, so re-running it at publish time proves
      # nothing new - and it can fail, because a handful of rows measure wall
      # clock (a sub-2ms perf budget, a real 1500ms timer, a log line that grows
      # a gateWait= field under load) and a shared two-core runner is not the
      # hardware they were written on. Push, watch ci go green, then tag. Item
      # 23 is the real fix.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native/staged

      # One vsix per target. .vscodeignore admits native/bin/** and nothing else under
      # native/, so the staging directory is swapped per target: only that target's pair is
      # under native/bin when its package is built.
      - name: Package per target
        run: |
          set -e
          for t in linux-x64 darwin-arm64 darwin-x64 win32-x64; do
            rm -rf native/bin && mkdir -p "native/bin/$t"
            cp "native/staged/native-$t"/* "native/bin/$t/"
            chmod +x "native/bin/$t"/*
            npx @vscode/vsce package --target "$t" --out "column-80-$t.vsix"
          done
          ls -la *.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          body: "See CHANGELOG.md for this release's changes."

      # Marketplace publish is opt-in: add a VSCE_PAT repo secret (a Personal
      # Access Token for the 'utilitydelta' publisher) and this step publishes;
      # without it the step skips and the GitHub Release is the ship.
      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT not set - skipping Marketplace publish (GitHub Release only)"
            exit 0
          fi
          # The gallery times out under load, which stranded a human-replay
          # release mid-publish. That is transient, so retry with backoff. A
          # duplicate version is what a re-run of a partial failure sees: treat
          # it as done, not an error. Every target is published, in turn.
          for f in *.vsix; do
            ok=0
            for attempt in 1 2 3; do
              if out=$(npx @vscode/vsce publish --packagePath "$f" -p "$VSCE_PAT" 2>&1); then
                echo "$out"; ok=1; break
              fi
              echo "$out"
              if echo "$out" | grep -qiE "already exists|already published|409"; then
                echo "$f: this version is already on the Marketplace - skipping"
                ok=1; break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "publish attempt $attempt failed - retrying in $((attempt * 30))s"
                sleep $((attempt * 30))
              fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "publish of $f failed after 3 attempts" >&2
              exit 1
            fi
          done
